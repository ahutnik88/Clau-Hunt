<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>La búsqueda de Claudio</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Special+Elite&display=swap');

  :root{
    --cream:#F5EDD8;
    --paper:#FBF6E8;
    --navy:#1B3A6B;
    --red:#C8102E;
    --ink:#3D2F1A;
    --sub:#5C4A2A;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Cormorant Garamond',serif;}
  .mono{font-family:'Special Elite',monospace;}
  .display{font-family:'DM Serif Display',serif;}
  .wrap{max-width:640px;margin:0 auto;padding:20px 16px 60px;}
  .rule{display:flex;align-items:center;gap:8px;color:var(--navy);margin:14px 0;}
  .rule .line{flex:1;height:1px;background:currentColor;opacity:.3;}
  .rule .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.6;}

  .card{background:var(--paper);border:2px solid var(--navy);padding:20px;box-shadow:5px 5px 0 var(--navy);}
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:10px;
    width:100%;padding:14px 16px;background:var(--navy);color:var(--paper);
    border:none;cursor:pointer;font-family:'Special Elite',monospace;
    font-size:13px;letter-spacing:.15em;transition:background .2s;
  }
  .btn:hover{background:var(--red);}
  .btn:disabled{opacity:.35;cursor:not-allowed;}
  .btn.outline{background:transparent;color:var(--navy);border:2px solid var(--navy);}
  .btn.outline:hover{background:var(--navy);color:var(--paper);}
  .btn.small{width:auto;padding:9px 14px;font-size:11px;}

  .eyebrow{font-family:'Special Elite',monospace;font-size:10px;letter-spacing:.3em;color:var(--red);}
  .locbox{border:2px dashed var(--navy);padding:12px 14px;background:var(--cream);display:flex;gap:10px;align-items:flex-start;margin:14px 0;}
  .locbox .pin{font-size:18px;}
  .stamps{display:flex;gap:10px;justify-content:center;margin:22px 0 6px;flex-wrap:wrap;}
  .stampdot{
    width:46px;height:46px;border-radius:50%;border:2px solid var(--navy);
    display:flex;align-items:center;justify-content:center;font-size:20px;
    background:var(--paper);color:var(--navy);position:relative;
  }
  .stampdot.done{background:var(--navy);color:var(--paper);}
  .stampdot.active{border-color:var(--red);box-shadow:0 0 0 3px rgba(200,16,46,.15);}

  textarea, input[type=text]{
    width:100%;padding:12px;border:2px solid var(--navy);background:var(--paper);
    font-family:'Cormorant Garamond',serif;font-size:16px;color:var(--ink);
  }
  textarea:focus, input[type=text]:focus{outline:none;border-color:var(--red);}

  .choice{
    border:2px solid var(--navy);padding:14px;margin-bottom:10px;cursor:pointer;
    background:var(--paper);transition:.15s;
  }
  .choice.selected{border-color:var(--red);background:#fff7ee;box-shadow:3px 3px 0 var(--red);}
  .choice h4{margin:0 0 4px;font-family:'DM Serif Display',serif;color:var(--navy);font-size:17px;}
  .choice p{margin:0;font-size:14px;color:var(--sub);}

  .filebtn{
    display:block;width:100%;text-align:center;padding:12px;border:2px dashed var(--navy);
    color:var(--navy);font-family:'Special Elite',monospace;font-size:12px;letter-spacing:.1em;
    cursor:pointer;background:var(--cream);margin-top:10px;
  }
  input[type=file]{display:none;}

  .preview{margin-top:10px;text-align:center;}
  .preview img, .preview video{max-width:100%;border:2px solid var(--navy);}

  .status{font-family:'Special Elite',monospace;font-size:11px;letter-spacing:.15em;color:var(--sub);margin-top:8px;text-align:center;}
  .divider{height:2px;background:var(--navy);opacity:.15;margin:18px 0;}

  .center{text-align:center;}
  .hidden{display:none !important;}

  a{color:var(--navy);}

  table.admin{width:100%;border-collapse:collapse;font-size:14px;}
  table.admin th, table.admin td{border:1px solid var(--navy);padding:8px;text-align:left;vertical-align:top;}
  table.admin th{background:var(--navy);color:var(--paper);font-family:'Special Elite',monospace;font-size:10px;letter-spacing:.1em;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--navy);color:var(--paper);padding:12px 20px;font-family:'Special Elite',monospace;
    font-size:12px;letter-spacing:.05em;z-index:999;max-width:90%;text-align:center;
  }
</style>

const STORAGE_PREFIX = "clau_hunt/";

async function saveShared(key, value){
  if(!FIREBASE_DB_URL){
    console.error("Falta configurar FIREBASE_DB_URL");
    return false;
  }
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${STORAGE_PREFIX}${key}.json`, {
      method: 'PUT',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(value)
    });
    return res.ok;
  }catch(e){
    console.error("storage set failed", key, e);
    return false;
  }
}
async function loadShared(key){
  if(!FIREBASE_DB_URL) return null;
  try{
    const res = await fetch(`${FIREBASE_DB_URL}/${STORAGE_PREFIX}${key}.json`);
    if(!res.ok) return null;
    return await res.json();
  }catch(e){
    return null;
  }
}
async function loadAllKeys(){
  const keys = ["started","progress_1","progress_2","progress_3","progress_4","unlocked_2","unlocked_3","unlocked_4","unlocked_final"];
  const out = {};
  for(const k of keys){ out[k] = await loadShared(k); }
  return out;
}

function fileToCompressedImage(file, maxDim = 1000, quality = 0.6){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = e => { img.src = e.target.result; };
    reader.onerror = reject;
    img.onload = () => {
      let w = img.width, h = img.height;
      if(w > h && w > maxDim){ h = h*(maxDim/w); w = maxDim; }
      else if(h > maxDim){ w = w*(maxDim/h); h = maxDim; }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(canvas.toDataURL('image/jpeg', quality));
    };
    img.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function fileToDataURL(file){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function showToast(msg, ms = 3600){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

/* ---------------- Guest flow ---------------- */
function startGuestPolling(){
  if(guestPollInterval) return;
  guestPollInterval = setInterval(render, 5000);
}
function stopGuestPolling(){
  if(guestPollInterval){ clearInterval(guestPollInterval); guestPollInterval = null; }
}

async function renderGuest(){
  const state = await loadAllKeys();

  let step; // 'landing' | 1..4 (riddle+challenge) | 'wait-2'..'wait-4','wait-final' | 'arrival'
  if(state.unlocked_final){ step = 'arrival'; }
  else if(state.progress_4){ step = 'wait-final'; }
  else if(state.unlocked_4){ step = 4; }
  else if(state.progress_3){ step = 'wait-4'; }
  else if(state.unlocked_3){ step = 3; }
  else if(state.progress_2){ step = 'wait-3'; }
  else if(state.unlocked_2){ step = 2; }
  else if(state.progress_1){ step = 'wait-2'; }
  else if(state.started){ step = 1; }
  else { step = 'landing'; }

  if(typeof step === 'string' && step.startsWith('wait')){ startGuestPolling(); } else { stopGuestPolling(); }

  const completedCount = [state.progress_1, state.progress_2, state.progress_3, state.progress_4].filter(Boolean).length;

  const stampsHtml = `
    <div class="stamps">
      ${STATIONS.map(s => {
        const done = !!state['progress_' + s.id];
        const isActive = step === s.id;
        return `<div class="stampdot ${done?'done':''} ${isActive?'active':''}" title="Parada ${s.id}">${s.icon}</div>`;
      }).join('')}
    </div>`;

  if(step === 'landing'){
    app.innerHTML = `
      <div class="center" style="margin-top:2vh;">
        <img src="portada.jpg" alt="" style="width:100%;border:2px solid var(--navy);box-shadow:5px 5px 0 var(--navy);">

        <h1 class="display" style="font-size:44px;color:var(--red);font-style:italic;margin:0 0 20px;">Caco</h1>
        <div class="rule"><div class="line"></div><div class="dot"></div><div class="line"></div></div>
        <p style="font-size:18px;color:var(--sub);font-style:italic;">Hoy no es un día cualquiera. Te preparamos un recorrido por cuatro lugares que forman parte de tu año — y en cada uno hay algo esperándote.</p>
        <button class="btn" style="margin-top:20px;" onclick="startHunt(this)">COMENZAR ✈</button>
      </div>`;
    return;
  }

  if(step === 'arrival'){
    app.innerHTML = `
      <div class="center" style="margin-top:8vh;">
        <div style="font-size:56px;">🎉</div>
        <div class="eyebrow" style="margin-top:10px;">✦ LLEGASTE AL FINAL ✦</div>
        <h1 class="display" style="font-size:36px;color:var(--navy);margin:10px 0;">El festejo sigue en...</h1>
        <div class="card" style="margin-top:16px;text-align:left;">
          <h2 class="display" style="color:var(--red);margin:0 0 6px;">${RESTAURANT.name}</h2>
          <p style="color:var(--sub);margin:0;">${RESTAURANT.address}</p>
          <div class="divider"></div>
          <p style="font-style:italic;">${RESTAURANT.note}</p>
        </div>
        <p style="margin-top:20px;color:var(--sub);font-style:italic;">Gracias por jugar, chevre. Te queremos. ❤️</p>
      </div>`;
    return;
  }

  if(typeof step === 'string' && step.startsWith('wait')){
    app.innerHTML = `
      ${stampsHtml}
      <div class="card center">
        <div class="eyebrow">✦ POSTA ENVIADA ✦</div>
        <h2 class="display" style="color:var(--navy);margin:8px 0;">¡Bien ahí!</h2>
        <p>Ya le avisamos a la familia lo que mandaste. En cuanto lo revisen te van a habilitar la próxima parada — esta página se actualiza sola, no hace falta que hagas nada.</p>
        <div class="status">Esperando aprobación…</div>
      </div>`;
    return;
  }

  // Numeric station step
  const station = STATIONS.find(s => s.id === step);
  const arrived = arrivedStationId === station.id;

let arrivedStationId = null;
let selectedChallenge = null;
let selectedFileData = null;
let selectedFileTooLarge = false;

function renderChoices(station){
  selectedChallenge = null; selectedFileData = null; selectedFileTooLarge = false;
  const container = document.getElementById('choices');
  container.innerHTML = station.challenges.map(c => `
    <div class="choice" id="choice-${c.id}" onclick="selectChoice('${station.id}','${c.id}')">
      <h4>Opción ${c.id.toUpperCase()}: ${c.label}</h4>
      <p>${c.instructions}</p>
    </div>`).join('');
}

function selectChoice(stationId, choiceId){
  const station = STATIONS.find(s => s.id == stationId);
  const challenge = station.challenges.find(c => c.id === choiceId);
  selectedChallenge = challenge;
  selectedFileData = null;
  selectedFileTooLarge = false;

  document.querySelectorAll('.choice').forEach(el => el.classList.remove('selected'));
  document.getElementById('choice-' + choiceId).classList.add('selected');

  const body = document.getElementById('challengeBody');
  const submitBtn = document.getElementById('submitBtn');

  if(challenge.type === 'text'){
    body.innerHTML = `<textarea id="textAnswer" rows="3" placeholder="Escribí tu respuesta acá..." style="margin-top:12px;"></textarea>`;
  } else {
    let accept = 'image/*', capture = 'environment', label = '📸 Sacar foto';
    if(challenge.type === 'audio'){ accept = 'audio/*'; label = '🎙️ Grabar audio'; }
    if(challenge.type === 'video'){ accept = 'video/*'; label = '🎥 Grabar video'; }
    if(challenge.type === 'video_or_photo'){ accept = 'image/*,video/*'; label = '📸🎥 Foto o video'; }
    body.innerHTML = `
      <label class="filebtn" id="fileLabel">${label}
        <input type="file" id="fileInput" accept="${accept}" capture="${capture}">
      </label>
      <div class="preview" id="filePreview"></div>`;
    document.getElementById('fileInput').addEventListener('change', handleFileSelect);
  }
  submitBtn.style.display = 'flex';
  document.getElementById('stationStatus').textContent = '';
}

async function handleFileSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const preview = document.getElementById('filePreview');
  preview.innerHTML = '<div class="status">Procesando…</div>';

  try{
    if(file.type.startsWith('image/')){
      selectedFileData = await fileToCompressedImage(file);
      preview.innerHTML = `<img src="${selectedFileData}">`;
      selectedFileTooLarge = false;
    } else {
      // video / audio — check raw size before attempting to store
      const approxEncodedMB = (file.size * 1.37) / (1024*1024);
      if(approxEncodedMB > 4.2){
        selectedFileTooLarge = true;
        selectedFileData = null;
        preview.innerHTML = `<div class="status" style="color:var(--red);">Este archivo es grande para guardarlo acá. Igual vamos a marcar la posta como completada — después mandalo por WhatsApp a la familia. 📲</div>`;
      } else {
        selectedFileData = await fileToDataURL(file);
        selectedFileTooLarge = false;
        preview.innerHTML = file.type.startsWith('video/')
          ? `<video src="${selectedFileData}" controls></video>`
          : `<audio src="${selectedFileData}" controls style="width:100%;"></audio>`;
      }
    }
  }catch(err){
    preview.innerHTML = `<div class="status" style="color:var(--red);">No se pudo procesar el archivo. Probá de nuevo.</div>`;
  }
}

async function submitChallenge(stationId){
  const station = STATIONS.find(s => s.id === stationId);
  if(!selectedChallenge){ showToast('Elegí una opción primero'); return; }

  const statusEl = document.getElementById('stationStatus');
  const submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  statusEl.textContent = 'Guardando…';

  let payload = {
    stationId,
    chosen: selectedChallenge.id,
    label: selectedChallenge.label,
    type: selectedChallenge.type,
    completedAt: new Date().toISOString(),
    mediaTooLarge: false
  };

  if(selectedChallenge.type === 'text'){
    const val = document.getElementById('textAnswer').value.trim();
    if(!val){ statusEl.textContent = ''; submitBtn.disabled = false; showToast('Escribí una respuesta antes de continuar'); return; }
    payload.textAnswer = val;
  } else {
    if(selectedFileTooLarge){
      payload.mediaTooLarge = true;
    } else if(selectedFileData){
      payload.media = selectedFileData;
    } else {
      statusEl.textContent = '';
      submitBtn.disabled = false;
      showToast('Subí una foto/video/audio antes de continuar');
      return;
    }
  }

  const ok = await saveShared('progress_' + stationId, payload);
  if(!ok){
    // retry once without media in case of size rejection
    const lean = {...payload, media: undefined, mediaTooLarge: true};
    const ok2 = await saveShared('progress_' + stationId, lean);
    if(!ok2){
      statusEl.textContent = '';
      submitBtn.disabled = false;
      showToast('Hubo un problema guardando. Probá de nuevo.');
      return;
    }
  }
  render();
}

async function startHunt(btn){
  if(btn){ btn.disabled = true; btn.textContent = 'UN SEGUNDO…'; }
  const ok = await saveShared('started', new Date().toISOString());
  if(!ok && btn){
    btn.disabled = false; btn.textContent = 'COMENZAR ✈';
    showToast('No se pudo guardar. Probá de nuevo.');
    return;
  }
  render();
}
window.startHunt = startHunt;
window.selectChoice = selectChoice;
window.submitChallenge = submitChallenge;

/* ---------------- Admin ---------------- */
async function renderAdmin(){
  if(!adminUnlocked){
    app.innerHTML = `
      <div class="card" style="margin-top:10vh;">
        <div class="eyebrow">✦ VISTA DE FAMILIA ✦</div>
        <h2 class="display" style="color:var(--navy);">Seguimiento en vivo</h2>
        <input type="text" id="adminPass" placeholder="Clave de familia" style="margin-top:10px;">
        <button class="btn" style="margin-top:12px;" onclick="tryAdminLogin()">ENTRAR</button>
        <div id="adminErr" class="status" style="color:var(--red);"></div>
      </div>`;
    return;
  }
  await drawAdminTable();
  if(!adminInterval){ adminInterval = setInterval(drawAdminTable, 5000); }
}

function tryAdminLogin(){
  const val = document.getElementById('adminPass').value;
  if(val === PASSCODE_ADMIN){ adminUnlocked = true; render(); }
  else { document.getElementById('adminErr').textContent = 'Clave incorrecta.'; }
}
window.tryAdminLogin = tryAdminLogin;

async function drawAdminTable(){
  const state = await loadAllKeys();
  const rows = STATIONS.map(s => {
    const p = state['progress_' + s.id];
    const unlockedKey = s.id === 1 ? true : state['unlocked_' + s.id];
    const nextKey = NEXT_UNLOCK_KEY[s.id];
    const nextUnlockedAt = state[nextKey];
    let statusTxt, mediaHtml = '', actionHtml = '';
    if(!unlockedKey){
      statusTxt = '⏳ Todavía no llegó';
    } else if(!p){
      statusTxt = '📍 En esta parada ahora';
    } else {
      statusTxt = `📥 Mandó opción ${p.chosen.toUpperCase()} — ${new Date(p.completedAt).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})}`;
      if(p.textAnswer){ mediaHtml = `<div style="margin-top:4px;font-style:italic;">"${p.textAnswer}"</div>`; }
      if(p.mediaTooLarge){ mediaHtml = `<div style="margin-top:4px;color:var(--red);">Archivo grande — lo va a compartir por WhatsApp aparte.</div>`; }
      if(p.media){
        if(p.type === 'photo'){ mediaHtml = `<img src="${p.media}" style="max-width:120px;display:block;margin-top:4px;">`; }
        else if(p.type === 'video' || (p.type==='video_or_photo' && p.media.startsWith('data:video'))){ mediaHtml = `<video src="${p.media}" controls style="max-width:160px;display:block;margin-top:4px;"></video>`; }
        else if(p.type === 'audio'){ mediaHtml = `<audio src="${p.media}" controls style="margin-top:4px;"></audio>`; }
        else { mediaHtml = `<img src="${p.media}" style="max-width:120px;display:block;margin-top:4px;">`; }
      }
      if(nextUnlockedAt){
        statusTxt += `<br>✅ Aprobado — ${new Date(nextUnlockedAt).toLocaleTimeString('es-AR', {hour:'2-digit', minute:'2-digit'})}`;
      } else {
        actionHtml = `<button class="btn small" style="margin-top:8px;" onclick="approveStation('${nextKey}')">APROBAR Y DESBLOQUEAR SIGUIENTE</button>`;
      }
    }
    return `<tr>
      <td>${s.icon} <strong>${s.name}</strong><br><span style="font-size:11px;color:var(--sub);">${s.subtitle}</span></td>
      <td>${statusTxt}${mediaHtml}${actionHtml}</td>
    </tr>`;
  }).join('');

  const finalTxt = state.unlocked_final ? `🎉 ¡Llegó al final! (${new Date(state.unlocked_final).toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})})` : '⏳ Todavía no llegó al final';

  app.innerHTML = `
    <div class="card">
      <div class="eyebrow">✦ VISTA DE FAMILIA ✦</div>
      <h2 class="display" style="color:var(--navy);">Cómo va Claudio</h2>
      <p class="status" style="text-align:left;">Se actualiza solo cada 5 segundos.</p>
      <table class="admin">${rows}</table>
      <div class="divider"></div>
      <p><strong>Final del recorrido:</strong> ${finalTxt}</p>
      <button class="btn small outline" onclick="drawAdminTable()">ACTUALIZAR AHORA</button>
      <button class="btn small outline" style="margin-top:8px;color:var(--red);border-color:var(--red);" onclick="resetAll()">REINICIAR TODO EL RECORRIDO</button>
    </div>`;
}
window.drawAdminTable = drawAdminTable;

async function approveStation(nextKey){
  await saveShared(nextKey, new Date().toISOString());
  drawAdminTable();
}
window.approveStation = approveStation;

async function resetAll(){
  if(!confirm('¿Seguro que querés reiniciar todo el recorrido? Se borra todo el progreso de Claudio.')) return;
  const keys = ["started","progress_1","progress_2","progress_3","progress_4","unlocked_2","unlocked_3","unlocked_4","unlocked_final"];
  for(const k of keys){ await saveShared(k, null); }
  drawAdminTable();
}
window.resetAll = resetAll;
</script>
